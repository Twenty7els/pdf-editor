<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .t { display:inline-block; white-space:nowrap; font-size:12px; font-weight:500; }
  .t.tight { letter-spacing: -0.025em; }
</style>
</head>
<body>
  <span class="t" id="a">Загрузить другой</span><br>
  <span class="t" id="b">Загрузить PDF</span><br>
  <span class="t" id="c">Скачать PDF</span><br>
  <span class="t" id="d">Подготовка...</span><br>
  <span class="t tight" id="e">Загрузить другой</span><br>
  <span class="t" id="f">Загрузить свою печать</span><br>
<script>
  window.ready = (() => {
    const out = {};
    for (const id of ["a","b","c","d","e","f"]) {
      out[id] = Math.ceil(document.getElementById(id).getBoundingClientRect().width * 10) / 10;
    }
    document.title = JSON.stringify(out);
    return true;
  })();
</script>
</body>
</html>
